<!--
  Consent Mode v2 default + Google Tag Manager (PRV-03, MSR-15).
  Place in <head>, before any other Google tag. The CMP must call
  gtag('consent', 'update', {...}) with the user's choice.
  Basic mode (default): GTM loads only after consent. The CMP calls window.loadGtm()
  once the user grants any Google-related purpose (PRF-13, PRV-01).
  Advanced mode (calling loadGtm() on page load) sends cookieless pings before consent;
  it is a documented exception that needs a legal assessment (MSR-15).
  No <noscript> GTM iframe: it would bypass consent.
-->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    functionality_storage: 'denied',
    personalization_storage: 'denied',
    security_storage: 'granted',
    wait_for_update: 500
  });
  gtag('set', 'ads_data_redaction', true);
</script>
<script>

    if (window.gtmLoaded) return;
    window.gtmLoaded = true;

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');
  };
</script>
