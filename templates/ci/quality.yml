# Copy to .github/workflows/quality.yml in a website repo. Assumes `npm run build` writes static HTML to ./dist.
# Edit the URL list in lighthouserc.json to your key templates (http://localhost/ is mapped to ./dist).
# Rules: QA-03 (static checks), QA-04 (Lighthouse CI), QA-09 (placeholders), TEC-02, SEO-25, PRF-02, A11Y-23.
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: HTML validation (TEC-02)
        run: npx --yes html-validate@11 "dist/**/*.html"

      - name: No placeholders in output (QA-09)
        run: |
          if grep -rIinE --include='*.html' 'lorem|\bTODO\b|FIXME|example\.com' dist || grep -rInE --include='*.html' 'XXX|REPLACE-' dist; then
            echo "Placeholder text found"; exit 1
          fi

      - name: Internal links (SEO-25)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"

      - name: Lighthouse CI (PRF-02, A11Y-23, QA-04)
        run: npx --yes @lhci/cli@0.15 autorun --config=lighthouserc.json
