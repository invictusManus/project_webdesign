# Copy to .github/workflows/quality.yml in a website repo. Assumes `npm run build` writes static HTML to ./dist.
# Rules: QA-03 (static checks), QA-04 (Lighthouse CI), QA-09 (placeholders), TEC-02, SEO-25, PRF-02, A11Y-23.
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: HTML validation (TEC-02)
        run: npx --yes html-validate@11 "dist/**/*.html"

      - name: No placeholders in output (QA-09)
        run: |
          if grep -rIinE 'lorem ipsum|\bTODO\b|FIXME|example\.com' dist; then
            echo "Placeholder text found"; exit 1
          fi

      - name: Internal links (SEO-25)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"

      - name: Lighthouse CI (PRF-02, A11Y-23, QA-04)
        run: npx --yes @lhci/cli@0.15 autorun --config=lighthouserc.json
