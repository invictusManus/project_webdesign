name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch dead source links

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check.sh
      # gesetze-im-internet.de times out from GitHub runners; check those links locally.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3
            --accept "200..=299,403,429"
            --exclude "example\.com"
            --exclude "gesetze-im-internet\.de"
            "./**/*.md"
