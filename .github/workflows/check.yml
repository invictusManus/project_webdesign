name: check

# Deterministic checks only, so this never fails on network flakiness.
# External links and Google doc changes are reported weekly by maintenance.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check.sh
      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline "./**/*.md"
