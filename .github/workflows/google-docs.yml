name: google-docs

# Weekly: fails when Google's Search documentation has new, removed or changed pages,
# so reference/google-search/ can be refreshed. Changed page texts are attached as an artifact.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/google-docs.py --text changed-pages
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: changed-google-docs
          path: changed-pages/
          if-no-files-found: ignore
